# Deploy do CONSULTOR CONTÁBIL (plano-contas-iob) no Cloud Run.
#
# POR QUE EXISTE (03/08/2026): este repositório não tinha workflow nenhum. O
# deploy dependia de alguém lembrar de rodar `gcloud run deploy` na mão — e o
# efeito prático foi o app ficar 13 dias sem atualização enquanto o CFI
# entregava todo dia. Mesmo desenho do deploy do CFI, adaptado: sem build de
# frontend (aqui o Express serve o HTML direto) e usando `--source`, que é como
# o serviço já era publicado (o .gcloudignore existe justamente pra isso).
#
# A revisão nova sobe SEM TRÁFEGO, passa por health check e só então recebe
# 100% — se subir quebrada, a revisão antiga continua servindo e ninguém vê
# erro.
name: Deploy Consultor Contábil

on:
  push:
    branches: [main]
    # Commit que só mexe em texto NÃO republica o app. Publicar por causa de
    # documentação gasta build, cria revisão nova sem mudança de código e
    # embaralha o histórico de deploys — daqui a um mês, ninguém sabe qual
    # revisão trouxe o quê. Mesmo filtro que o CFI já usa.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/audit-deps.yml'
  workflow_dispatch:

# MATA-BURRO: DEPLOY QUE FALHA NÃO PODE PASSAR BATIDO.
#
# Em 12/08/2026 DOIS deploys deste repositório falharam seguidos e ninguém viu.
# O trabalho ficou mesclado na main e FORA DO AR, e a descoberta veio de um
# print de tela desatualizada — depois de tempo gasto procurando um defeito que
# já estava corrigido.
#
# Run vermelho num painel que ninguém abre não é aviso. Issue é.
permissions:
  contents: read
  issues: write

env:
  # Descobertos no próprio repositório (seed-historicos.sh e server.js). Dá pra
  # sobrescrever por Variables do repositório sem mexer no workflow.
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'plano-contas-iob' }}
  REGION: ${{ vars.CLOUD_RUN_REGION || 'us-west1' }}
  # DOIS PROJETOS, e confundi-los custou 13 runs vermelhos (07/08):
  #   · Cloud Run e Firestore de dados → gen-lang-client-0569062468
  #   · Firebase Authentication       → projetos-app-sp
  # O default anterior apontava pro projeto do Firestore, e o gcloud respondia
  # "Cloud Run Admin API não está habilitada" — mensagem que manda habilitar a
  # API no lugar errado, em vez de dizer que o projeto é outro.
  # A verdade está em scripts/deploy-production.sh, que publica de verdade.
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'gen-lang-client-0569062468' }}
  CCI_DATA_PROJECT_ID: ${{ vars.CCI_DATA_PROJECT_ID || 'gen-lang-client-0569062468' }}
  CCI_AUTH_PROJECT_ID: ${{ vars.CCI_AUTH_PROJECT_ID || 'projetos-app-sp' }}
  CCI_BACKUP_PROJECT_ID: ${{ vars.CCI_BACKUP_PROJECT_ID || 'gen-lang-client-0569062468' }}
  CCI_BACKUP_BUCKET: ${{ vars.CCI_BACKUP_BUCKET || 'cci-firestore-backups-292090471177' }}
  CCI_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CCI_RUNTIME_SERVICE_ACCOUNT || 'cci-runtime@gen-lang-client-0569062468.iam.gserviceaccount.com' }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir configuração antes de começar
        # Falha CEDO e explicando, em vez de estourar lá no meio do deploy com
        # erro de credencial.
        #
        # O secret entra por `env`, NUNCA interpolado direto no shell: valor de
        # secret dentro do script vira histórico de comando e pode escapar do
        # mascaramento.
        env:
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::Falta o secret GCP_SA_KEY neste repositório."
            cat >&2 <<'ACAO'

          COMO CONFIGURAR (uma vez):
            Settings → Secrets and variables → Actions → New repository secret
              Nome:  GCP_SA_KEY
              Valor: JSON da service account com permissão de deploy

          PAPÉIS NECESSÁRIOS — concedidos NO PROJETO DO CLOUD RUN
          (gen-lang-client-0569062468), que também contém o Firestore de dados.
          O deploy é `gcloud run deploy --source .`, que passa por Cloud Build,
          Cloud Storage (bucket de origem) e Artifact Registry. Faltar UM
          derruba só na hora do build:
            roles/run.admin
            roles/iam.serviceAccountUser
            roles/cloudbuild.builds.editor
            roles/artifactregistry.admin   (writer não cria o repositório)
            roles/storage.admin            (bucket de origem do --source)

          Opcional, se algum dia mudar de serviço/região/projeto —
          Settings → Variables:
            CLOUD_RUN_SERVICE, CLOUD_RUN_REGION, GCP_PROJECT_ID
          ACAO
            exit 1
          fi

          # O SECRET EXISTE, MAS É O ARQUIVO CERTO?
          #
          # Aconteceu em 07/08: a chave foi criada em **P12** (a opção fica ao
          # lado de JSON no mesmo diálogo do Google Cloud) e o secret ficou com
          # conteúdo BINÁRIO. O deploy rodava npm ci, auditoria e os 40 testes
          # — quase um minuto — pra só então morrer no passo de autenticação
          # com "unexpected token '\uFFFD' ... is not valid JSON", que é
          # mensagem de biblioteca e não diz a ninguém o que fazer.
          #
          # Conferir aqui custa milissegundos e nomeia o erro. NADA do conteúdo
          # é impresso: só o veredito.
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa-key-check.json"
          TIPO=$(jq -r 'try .type catch ""' "$RUNNER_TEMP/sa-key-check.json" 2>/dev/null || true)
          rm -f "$RUNNER_TEMP/sa-key-check.json"
          if [ "$TIPO" != "service_account" ]; then
            echo "::error::O secret GCP_SA_KEY existe, mas não é um JSON de service account."
            cat >&2 <<'ACAO'

          O QUE PROVAVELMENTE ACONTECEU:
            A chave foi criada no formato P12 (binário), não JSON. As duas
            opções ficam lado a lado no mesmo diálogo do Google Cloud.

          COMO CORRIGIR, sem copiar e colar (é o copiar/colar que estraga):
            gcloud iam service-accounts list --project=projetos-app-sp
            gcloud iam service-accounts keys create ~/gcp-deploy.json \
              --iam-account=<EMAIL_DA_CONTA> --project=projetos-app-sp
            gh secret set GCP_SA_KEY --repo <owner>/<repo> < ~/gcp-deploy.json
            rm ~/gcp-deploy.json

          O arquivo certo começa com { e tem "type": "service_account" na
          primeira linha. Apague a chave P12 no console depois — chave de
          service account sem uso é risco parado.
          ACAO
            exit 1
          fi
          echo "Serviço: $SERVICE_NAME · Região: $REGION · Projeto: $PROJECT_ID"
          echo "Credencial: JSON de service account, formato conferido."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Auditoria de dependências (bloqueia em high/critical de PRODUÇÃO)
        # Só o que VAI NA IMAGEM bloqueia (--omit=dev). Advisory de dependência
        # de desenvolvimento vai pro resumo e é resolvido pelo robô diário
        # (audit-deps.yml), sem segurar entrega.
        # Escape hatch pra hotfix: `[skip-audit]` no ASSUNTO do commit.
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          if printf '%s' "$SUBJECT" | grep -qF '[skip-audit]'; then
            echo "→ [skip-audit] no assunto do commit — auditoria pulada (hotfix)."
            exit 0
          fi

          if ! npm audit --omit=dev --audit-level=high; then
            echo "::error::Advisory high/critical em dependência de PRODUÇÃO."
            cat >&2 <<'ACAO'

          COMO RESOLVER (nesta ordem):
            1. npm audit fix
            2. se um "overrides" do package.json segurar a versão velha, suba o
               PISO da faixa (ex.: "^1.2.3" -> "^1.2.4") — nunca versão exata,
               que cria teto e trava o audit fix
            3. sem correção upstream (caso do xlsx/SheetJS): trocar pelo mirror
               publicado no npm, como já foi feito com @e965/xlsx
          ACAO
            exit 1
          fi

          if ! npm audit --audit-level=high > /tmp/audit-dev.txt 2>&1; then
            echo "::warning::Advisory high/critical em dependência de DESENVOLVIMENTO — não bloqueia o deploy."
            {
              echo "### ⚠️ Auditoria — dependência de desenvolvimento"
              echo '```'
              cat /tmp/audit-dev.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Porta de qualidade (sintaxe + rotas + testes portáteis)
        # `npm run check` é a porta COMPLETA, mas boa parte dos testes abre
        # arquivos de evidência que só existem na máquina de quem os gravou.
        # O check:ci roda tudo que é portátil e DECLARA quantos pulou — nunca
        # apresenta cobertura parcial como se fosse total.
        run: npm run check:ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ─────────────────────────────────────────────────────────────────────
      # O gcloud tem DOIS "projetos", e eles se separam sem avisar:
      #   · o do RECURSO → resolvido por `--project` em cada comando
      #   · o da QUOTA   → quem "paga" a chamada de API e onde a API precisa
      #                    estar habilitada
      #
      # ⚠️ CORREÇÃO DE UMA EXPLICAÇÃO ERRADA que ficou aqui em 07/08: eu havia
      # escrito que fixar CLOUDSDK_CORE_PROJECT resolvia a quota. NÃO RESOLVE —
      # o log do run #16 provou: as variáveis mudaram para o projeto certo e o
      # erro continuou citando `consumer: projects/641538949234`. O projeto da
      # quota vem do **dono da credencial**, não do projeto padrão do gcloud, e
      # nenhuma variável de ambiente muda isso.
      #
      # A CURA é a conta de serviço morar NO MESMO PROJETO do Cloud Run —
      # credencial, recurso e quota no mesmo lugar. Foi o que se fez.
      #
      # Este passo FICA mesmo assim, com o motivo certo: mantém o projeto
      # padrão coerente com o do deploy, então um `gcloud` que alguém adicione
      # sem `--project` acerta o alvo em vez de mirar no projeto da chave.
      # ─────────────────────────────────────────────────────────────────────
      - name: Fixar o projeto do gcloud (recurso E quota no mesmo lugar)
        run: |
          for V in CLOUDSDK_CORE_PROJECT CLOUDSDK_PROJECT GCLOUD_PROJECT GCP_PROJECT GOOGLE_CLOUD_PROJECT; do
            echo "$V=$PROJECT_ID" >> "$GITHUB_ENV"
          done
          echo "Projeto do gcloud fixado em $PROJECT_ID (recurso e quota)."

      - name: Bloquear downgrade da versão em produção
        run: |
          CANDIDATE_VERSION=$(node -p "require('./version.json').version")
          if ! PRODUCTION_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='value(status.url)' 2>/dev/null); then
            echo "Serviço ainda não existe; liberando o primeiro deploy da versão $CANDIDATE_VERSION."
            exit 0
          fi
          test -n "$PRODUCTION_URL" || { echo "::error::Serviço existente sem URL pública para conferir a versão."; exit 1; }
          PRODUCTION_VERSION=$(curl --retry 3 --retry-all-errors --connect-timeout 10 -sSf \
            "$PRODUCTION_URL/api/version" | jq -er '.version | select(type == "string" and length > 0)')
          node - "$CANDIDATE_VERSION" "$PRODUCTION_VERSION" <<'NODE'
          const candidate = process.argv[2];
          const production = process.argv[3];
          const parse = (value) => {
            const match = String(value || '').match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!match) throw new Error(`versão inválida: ${value || '(vazia)'}`);
            return match.slice(1).map(Number);
          };
          const left = parse(candidate);
          const right = parse(production);
          const order = left.findIndex((part, index) => part !== right[index]);
          if (order >= 0 && left[order] < right[order]) {
            console.error(`::error::Downgrade bloqueado: candidato ${candidate}, produção ${production}.`);
            process.exit(1);
          }
          console.log(`Versão autorizada: candidato ${candidate}, produção ${production}.`);
          NODE

      - name: Deploy no Cloud Run (sem tráfego, revisão candidata)
        # --no-traffic + --tag candidate: a revisão nova sobe isolada. Só recebe
        # tráfego depois de passar no health check. Retry porque o Cloud Run
        # devolve ABORTED quando outra operação toca o serviço no meio.
        run: |
          for attempt in 1 2 3; do
            if gcloud run deploy "$SERVICE_NAME" \
              --source . \
              --platform managed \
              --region "$REGION" \
              --project "$PROJECT_ID" \
              --service-account "$CCI_RUNTIME_SERVICE_ACCOUNT" \
              --update-env-vars=CCI_RUNTIME_PROJECT_ID="$PROJECT_ID",CCI_DATA_PROJECT_ID="$CCI_DATA_PROJECT_ID",CCI_AUTH_PROJECT_ID="$CCI_AUTH_PROJECT_ID",CCI_BACKUP_PROJECT_ID="$CCI_BACKUP_PROJECT_ID",CCI_BACKUP_BUCKET="$CCI_BACKUP_BUCKET",MERCADO_PAGO_OAUTH_ENABLED=false,DEPARTAMENTO_GATE_MODO=bloqueio,REINF_TRANSMISSOR=gateway,GEMINI_MODEL=gemini-3.7-flash,GEMINI_FLASH_MODEL=gemini-3.7-flash,GEMINI_CHAT_MODEL=gemini-3.7-flash,GEMINI_ALLOW_CLIENT_MODEL=false \
              --remove-env-vars=MERCADO_PAGO_CLIENT_ID,MERCADO_PAGO_CLIENT_SECRET \
              --no-traffic --tag candidate \
              --quiet; then
              DEPLOYED_RUNTIME_SA=$(gcloud run services describe "$SERVICE_NAME" \
                --region "$REGION" --project "$PROJECT_ID" \
                --format='value(spec.template.spec.serviceAccountName)')
              if [ "$DEPLOYED_RUNTIME_SA" != "$CCI_RUNTIME_SERVICE_ACCOUNT" ]; then
                echo "::error::Runtime usa $DEPLOYED_RUNTIME_SA; esperado $CCI_RUNTIME_SERVICE_ACCOUNT."
                exit 1
              fi
              exit 0
            fi
            echo "Deploy falhou (tentativa ${attempt}/3) — aguardando antes de repetir…"
            sleep $((attempt * 15))
          done
          echo "Deploy falhou após 3 tentativas."
          exit 1

      - name: Health check da candidata (antes de rotear)
        # /api/health é público E toca o Firestore (lê a coleção planos) — pega
        # revisão que sobe mas não fala com o banco. Se falhar, o tráfego NÃO é
        # roteado e a revisão antiga segue servindo.
        run: |
          EXPECTED_VERSION=$(node -p "require('./version.json').version")
          CANDIDATE_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --platform managed --region "$REGION" --project "$PROJECT_ID" \
            --format=json | jq -r '.status.traffic[] | select(.tag=="candidate") | .url' | head -n1)
          if [ -z "$CANDIDATE_URL" ]; then
            echo "::error::Não achei a URL da revisão candidata (tag=candidate)."; exit 1
          fi
          echo "Revisão candidata: $CANDIDATE_URL"
          HEALTH_OK=0
          for attempt in 1 2 3 4 5; do
            if curl -sSf "$CANDIDATE_URL/api/health" > /tmp/health.json; then
              echo "✓ /api/health OK na candidata (processo + Firestore)"
              cat /tmp/health.json
              HEALTH_OK=1
              break
            fi
            echo "health ainda não respondeu OK (tentativa ${attempt}/5)…"
            sleep $((attempt * 5))
          done
          if [ "$HEALTH_OK" != "1" ]; then
            echo "::error::Candidata NÃO passou no health — tráfego não roteado (revisão antiga segue ativa)."
            exit 1
          fi

          HEALTH_MODEL=$(jq -r '.gemini_model // empty' /tmp/health.json)
          if [ "$HEALTH_MODEL" != "gemini-3.7-flash" ]; then
            echo "::error::Candidata iniciou com motor $HEALTH_MODEL; esperado gemini-3.7-flash."
            exit 1
          fi
          jq -e --arg runtime "$PROJECT_ID" --arg data "$CCI_DATA_PROJECT_ID" --arg auth "$CCI_AUTH_PROJECT_ID" --arg backup "$CCI_BACKUP_PROJECT_ID" \
            '.projects == {runtime:$runtime,data:$data,auth:$auth,backup:$backup}' /tmp/health.json >/dev/null || {
            echo "::error::Topologia de projetos da candidata diverge da configuração explícita."; exit 1;
          }

          API_VERSION=$(curl -sSf "$CANDIDATE_URL/api/version" | jq -r '.version // empty')
          curl -sSf "$CANDIDATE_URL/?build=$EXPECTED_VERSION" > /tmp/candidate-index.html
          if [ "$API_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::API da candidata está em $API_VERSION; esperado $EXPECTED_VERSION."
            exit 1
          fi
          grep -Fq "window.__PLANO_CONTAS_IOB_BUILD__ = '$EXPECTED_VERSION'" /tmp/candidate-index.html || {
            echo "::error::HTML da candidata não está na versão $EXPECTED_VERSION."; exit 1;
          }
          grep -Fq 'id="btnAtivarEmpresaNav"' /tmp/candidate-index.html || {
            echo "::error::HTML da candidata não contém a ativação obrigatória."; exit 1;
          }
          grep -Fq 'function abrirCarteiraResponsaveis()' /tmp/candidate-index.html || {
            echo "::error::HTML da candidata não contém a carteira contábil esperada."; exit 1;
          }
          echo "✓ API, HTML, ativação e carteira conferidos na candidata $EXPECTED_VERSION"

      - name: Rotear tráfego para a candidata (health OK)
        # Roteia pelo NOME da revisão validada (não --to-latest): um deploy
        # concorrente que criasse revisão mais nova entre o health e este passo
        # não sequestra o tráfego. O --remove-tags limpa a tag na mesma chamada.
        run: |
          REV=$(gcloud run services describe "$SERVICE_NAME" \
            --platform managed --region "$REGION" --project "$PROJECT_ID" \
            --format=json | jq -r '.status.traffic[] | select(.tag=="candidate") | .revisionName' | head -n1)
          if [ -z "$REV" ]; then
            echo "::error::Não achei a revisão candidata para rotear."; exit 1
          fi
          echo "Roteando 100% para a revisão validada: $REV"
          for attempt in 1 2 3; do
            if gcloud run services update-traffic "$SERVICE_NAME" \
              --to-revisions "${REV}=100" \
              --remove-tags candidate \
              --platform managed --region "$REGION" --project "$PROJECT_ID" --quiet; then
              exit 0
            fi
            echo "update-traffic falhou (tentativa ${attempt}/3) — aguardando…"
            sleep $((attempt * 15))
          done
          echo "::error::update-traffic falhou após 3 tentativas (revisão antiga segue ativa)."
          exit 1

      - name: Health check final (produção)
        run: |
          sleep 5
          EXPECTED_VERSION=$(node -p "require('./version.json').version")
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --platform managed --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.url)')
          echo "── /api/health ──"
          curl -sSf "$URL/api/health" > /tmp/production-health.json || { echo "::error::Health final falhou."; exit 1; }
          cat /tmp/production-health.json
          HEALTH_MODEL=$(jq -r '.gemini_model // empty' /tmp/production-health.json)
          if [ "$HEALTH_MODEL" != "gemini-3.7-flash" ]; then
            echo "::error::Produção iniciou com motor $HEALTH_MODEL; esperado gemini-3.7-flash."; exit 1
          fi
          jq -e --arg runtime "$PROJECT_ID" --arg data "$CCI_DATA_PROJECT_ID" --arg auth "$CCI_AUTH_PROJECT_ID" --arg backup "$CCI_BACKUP_PROJECT_ID" \
            '.projects == {runtime:$runtime,data:$data,auth:$auth,backup:$backup}' /tmp/production-health.json >/dev/null || {
            echo "::error::Topologia de projetos da produção diverge da configuração explícita."; exit 1;
          }
          echo ""
          echo "── /api/version ──"
          API_VERSION=$(curl -sSf "$URL/api/version" | jq -r '.version // empty')
          echo "$API_VERSION"
          curl -sSf "$URL/?build=$EXPECTED_VERSION" > /tmp/production-index.html
          if [ "$API_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::API pública está em $API_VERSION; esperado $EXPECTED_VERSION."; exit 1
          fi
          grep -Fq "window.__PLANO_CONTAS_IOB_BUILD__ = '$EXPECTED_VERSION'" /tmp/production-index.html || {
            echo "::error::HTML público não está na versão $EXPECTED_VERSION."; exit 1;
          }
          grep -Fq 'id="btnAtivarEmpresaNav"' /tmp/production-index.html || {
            echo "::error::HTML público não contém a ativação obrigatória."; exit 1;
          }
          grep -Fq 'function abrirCarteiraResponsaveis()' /tmp/production-index.html || {
            echo "::error::HTML público não contém a carteira contábil esperada."; exit 1;
          }
          echo "✓ API e HTML públicos validados na versão $EXPECTED_VERSION"
          {
            echo "### ✅ Deploy publicado"
            echo "- Serviço: \`$SERVICE_NAME\` ($REGION)"
            echo "- URL: $URL"
            echo "- Versão validada na API e no HTML: $EXPECTED_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── A trava ───────────────────────────────────────────────────────────
      # `if: failure()` cobre QUALQUER passo acima. O que importa não é onde
      # quebrou: é que a main tem código que não está no ar.
      - name: Deploy falhou — abrir/atualizar issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITULO="🚨 Deploy do Consultor Contábil FALHOU — a main não está no ar"
          CORPO=$(cat <<-CORPO_ISSUE
          O deploy da \`main\` falhou. **O que está mesclado NÃO está publicado** —
          quem testar agora vai ver a versão anterior, e um print dessa tela
          parece defeito de código.

          | | |
          | --- | --- |
          | Commit | \`${{ github.sha }}\` |
          | Mensagem | ${{ github.event.head_commit.message }} |
          | Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |

          **O que fazer**
          1. Abrir o run e ver QUAL passo caiu (o log diz).
          2. Se for a porta de qualidade: rodar \`npm run check:ci\` na máquina,
             corrigir e mesclar de novo.
          3. Se a falha for de **cache-buster de versão**, é o caso conhecido de
             12/08: rode \`./scripts/bump-version.sh\`, que propaga a versão para
             os quatro arquivos sozinho. Não edite à mão.

          **Enquanto isto estiver aberto, não confie em print de tela** — confira
          a versão primeiro (menu ℹ️ Sobre o Sistema → "Versão atual").

          _Esta issue é fechada à mão quando o deploy voltar a passar._
          CORPO_ISSUE
          )
          EXISTE=$(gh issue list --search "$TITULO in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTE" ]; then
            # Uma issue por incidente: falhar de novo COMENTA. Enxurrada de
            # issues iguais vira ruído que se ignora — o efeito oposto ao que
            # esta trava existe pra produzir.
            gh issue comment "$EXISTE" --body "$CORPO"
          else
            gh issue create --title "$TITULO" --body "$CORPO"
          fi
