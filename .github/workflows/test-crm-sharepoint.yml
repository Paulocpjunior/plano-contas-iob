name: Testes documentais do CCI

on:
  pull_request:
    paths:
      - 'crm-sharepoint-*.js'
      - 'crm-contabil-ui.js'
      - 'crm-experiencia.css'
      - 'index.html'
      - 'public-assets.json'
      - 'carteira-contabil.js'
      - 'crm-contabil.js'
      - 'notificacoes-*.js'
      - 'server.js'
      - 'package.json'
      - 'scripts/test-crm-sharepoint-*.js'
      - 'scripts/helpers/sharepoint-firestore.js'
      - '.github/workflows/test-crm-sharepoint.yml'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Conferir sintaxe e integração com dependências simuladas
        run: |
          node --check server.js
          npm run check:crm-sharepoint
          npm run test:crm-sharepoint

  qualidade-completa:
    name: Gate completo portável do CCI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependências do lockfile
        timeout-minutes: 10
        run: npm ci
      - name: Executar a porta de qualidade e informar testes pulados
        run: npm run check:ci
