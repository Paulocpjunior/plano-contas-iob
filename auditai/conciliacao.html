    <script>(function(){try{var t=localStorage.getItem('sp_saas_theme')||localStorage.getItem('auditAI_theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.classList.toggle('dark',t==='dark');document.documentElement.style.colorScheme=t;}catch(e){}})();</script>

    <script>
      // Visual no estilo Apple: cópia dos valores do tailwind.auditai.config.js (o scripts/test-tema-apple.js confere).
      (function () {
        var neutros = { 50: '#fbfbfd', 100: '#f5f5f7', 200: '#e8e8ed', 300: '#d2d2d7', 400: '#a1a1a6', 500: '#6e6e73', 600: '#515154', 700: '#3a3a3c', 800: '#2c2c2e', 900: '#1c1c1e', 950: '#000000' };

            extend: {

              colors: {
                primary: '#1c1c1e',
                secondary: '#3a3a3c',
                accent: '#0071e3',

                gray: neutros,
